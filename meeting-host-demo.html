<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会议主持人工作台</title>
</head>
<body>
<div id="meeting-host-app">
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f8;
      --panel: #ffffff;
      --panel-soft: #f6f8fb;
      --ink: #111827;
      --muted: #5f6c80;
      --line: #d8e1ec;
      --primary: #1f5eff;
      --primary-weak: #e8efff;
      --accent: #0a7f73;
      --accent-weak: #e5f5f2;
      --warn: #b45309;
      --warn-weak: #fff3dc;
      --shadow: 0 24px 70px rgba(17, 24, 39, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(31, 94, 255, 0.14), transparent 34%),
        linear-gradient(180deg, rgba(10, 127, 115, 0.07), transparent 46%),
        var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    #meeting-host-app {
      min-height: 100vh;
      padding: 24px;
    }

    .shell {
      max-width: 1440px;
      margin: 0 auto;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(520px, auto);
      gap: 20px;
      align-items: center;
      padding: 20px 22px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .title-group {
      min-width: 0;
    }

    .eyebrow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #4b5b73;
      font-size: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 13px;
      white-space: nowrap;
    }

    .badge.status-idle {
      background: var(--warn-weak);
      color: var(--warn);
      border-color: rgba(180, 83, 9, 0.22);
    }

    .badge.status-live {
      background: var(--accent-weak);
      color: var(--accent);
      border-color: rgba(15, 118, 110, 0.24);
    }

    .meeting-actions {
      display: grid;
      grid-template-columns: minmax(220px, 280px) auto;
      gap: 10px;
      justify-content: end;
      align-items: end;
    }

    .action-buttons {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      align-items: end;
    }

    .meeting-topic-field {
      display: grid;
      gap: 6px;
      width: min(260px, 100%);
    }

    .meeting-topic-field label {
      color: var(--muted);
      font-size: 12px;
    }

    .meeting-topic-field input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--ink);
    }

    button {
      min-height: 40px;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(37, 99, 235, 0.38);
      background: var(--primary-weak);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.52;
      transform: none;
    }

    .primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 12px 24px rgba(31, 94, 255, 0.22);
    }

    .primary:hover {
      background: #1d4ed8;
      color: #fff;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(380px, 2fr);
      grid-template-rows: clamp(380px, 28vw, 460px) minmax(420px, 1fr);
      grid-template-areas:
        "video minutes"
        "transcript query";
      gap: 18px;
      margin-top: 18px;
      align-items: stretch;
    }

    .video-panel {
      grid-area: video;
    }

    .minutes-panel {
      grid-area: minutes;
    }

    .transcript-panel {
      grid-area: transcript;
    }

    .query-panel {
      grid-area: query;
    }

    .panel {
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 16px 42px rgba(17, 24, 39, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, var(--panel-soft));
    }

    .panel-head-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .panel-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .panel-note {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .video-placeholder {
      position: relative;
      height: 100%;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(31, 94, 255, 0.2), rgba(10, 127, 115, 0.12)),
        #0d1b31;
      color: #eef4ff;
    }

    .screen-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050b14;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .video-placeholder.is-live .screen-video {
      opacity: 1;
    }

    .video-placeholder.is-live .video-inner {
      opacity: 0;
      pointer-events: none;
    }

    .video-placeholder.is-live::before {
      display: none;
    }

    .video-placeholder::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      pointer-events: none;
    }

    .video-inner {
      position: relative;
      width: min(520px, 100%);
      text-align: center;
      transition: opacity 0.2s ease;
    }

    .play-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.26);
      font-size: 28px;
    }

    .video-title {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    .video-copy {
      margin: 10px 0 0;
      color: rgba(238, 244, 255, 0.78);
      font-size: 14px;
    }

    .video-meta {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: rgba(238, 244, 255, 0.8);
      font-size: 13px;
    }

    .content {
      min-height: 0;
      padding: 16px;
    }

    .minutes-panel .content,
    .transcript-panel .content,
    .query-panel .content {
      flex: 1;
      overflow: auto;
      scrollbar-gutter: stable;
    }

    .minutes-panel .content::-webkit-scrollbar,
    .transcript-panel .content::-webkit-scrollbar,
    .query-panel .content::-webkit-scrollbar {
      width: 8px;
    }

    .minutes-panel .content::-webkit-scrollbar-thumb,
    .transcript-panel .content::-webkit-scrollbar-thumb,
    .query-panel .content::-webkit-scrollbar-thumb {
      background: #c6d1df;
      border-radius: 999px;
    }

    .transcript-list {
      display: grid;
      gap: 10px;
      padding-right: 4px;
    }

    .transcript-item {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-soft);
    }

    .time {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .speaker {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
    }

    .text {
      margin: 0;
      font-size: 14px;
      line-height: 1.72;
    }

    .empty-state {
      padding: 26px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: var(--panel-soft);
    }

    .minutes {
      display: grid;
      gap: 14px;
    }

    .minutes-section {
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .minutes-section:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .section-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .minutes-section p,
    .minutes-section ul {
      margin: 0;
      font-size: 14px;
      line-height: 1.72;
    }

    ul {
      padding-left: 20px;
    }

    .task-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .task-table th,
    .task-table td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .task-table th {
      color: var(--muted);
      font-weight: 600;
      background: var(--panel-soft);
    }

    .query-box {
      display: grid;
      gap: 10px;
    }

    .query-actions {
      display: flex;
      justify-content: flex-end;
    }

    textarea,
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--ink);
      background: var(--panel);
      font: inherit;
      font-size: 14px;
    }

    textarea {
      min-height: 104px;
      resize: vertical;
      line-height: 1.6;
    }

    .answer {
      margin-top: 12px;
      min-height: 180px;
      padding: 12px;
      border-radius: 12px;
      background: var(--primary-weak);
      border: 1px solid rgba(37, 99, 235, 0.18);
      font-size: 14px;
      line-height: 1.72;
      white-space: pre-wrap;
    }

    .markdown-output {
      margin: 0;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .history-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .history-card {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      text-align: left;
      box-shadow: none;
    }

    .history-card:hover {
      background: #eef4ff;
    }

    .history-card strong {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .history-card span {
      color: var(--muted);
      font-size: 13px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(17, 24, 39, 0.42);
    }

    .modal-backdrop.is-open {
      display: grid;
    }

    .minutes-dialog {
      width: min(760px, 100%);
      max-height: min(760px, 88vh);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .dialog-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .dialog-title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .dialog-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .dialog-body {
      padding: 16px;
      overflow: auto;
    }

    @media (max-width: 1080px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        grid-template-areas:
          "video"
          "minutes"
          "transcript"
          "query";
      }

      .video-placeholder {
        aspect-ratio: 16 / 9;
        height: auto;
        min-height: 280px;
      }

      .minutes-panel .content,
      .transcript-panel .content,
      .query-panel .content {
        overflow: visible;
      }
    }

    @media (max-width: 720px) {
      #meeting-host-app {
        padding: 14px;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .meeting-actions {
        grid-template-columns: 1fr;
        justify-content: flex-start;
      }

      .action-buttons {
        flex-wrap: wrap;
      }

      .meeting-topic-field {
        flex: 1 1 100%;
        width: 100%;
      }

      button {
        flex: 1 1 150px;
      }

      .video-placeholder {
        min-height: 210px;
      }

      .video-meta {
        position: static;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      .transcript-item {
        grid-template-columns: 1fr;
      }

    }
  </style>

  <main class="shell" aria-label="会议主持人工作台">
    <section class="topbar">
      <div class="title-group">
        <div class="eyebrow">
          <span class="badge">角色：会议主持人</span>
          <span id="meetingStatus" class="badge status-idle">状态：未开始</span>
        </div>
        <h1 id="meetingTitle">会议助手演示</h1>
        <p class="subtitle">会议视频分析、实时转写、结构化纪要与历史纪要查询。</p>
      </div>
      <div class="meeting-actions" aria-label="会议操作">
        <div class="meeting-topic-field">
          <label for="meetingTopicInput">会议主题</label>
          <input id="meetingTopicInput" value="会议助手演示" autocomplete="off">
        </div>
        <div class="action-buttons">
          <button id="startBtn" class="primary" type="button">开始会议</button>
          <button id="minutesBtn" type="button" disabled>生成纪要</button>
          <button id="saveBtn" type="button" disabled>保存到知识库</button>
        </div>
      </div>
    </section>

    <section class="workspace">
      <section class="panel video-panel" aria-label="会议视频区">
        <div id="videoSurface" class="video-placeholder">
          <video id="screenVideo" class="screen-video" autoplay muted playsinline></video>
          <div class="video-inner">
            <div class="play-mark" aria-hidden="true">▷</div>
            <h2 class="video-title">会议视频</h2>
            <p class="video-copy">点击“开始会议”后选择本地屏幕或窗口</p>
          </div>
          <div class="video-meta">
            <span id="videoState">视频状态：待接入</span>
            <span>16:9</span>
          </div>
        </div>
      </section>

      <section class="panel minutes-panel" aria-label="结构化会议纪要区">
        <div class="panel-head">
          <div>
            <h2 class="panel-title">结构化会议纪要</h2>
            <p class="panel-note">由会议主持人根据实时转写整理。</p>
          </div>
          <span id="minutesState" class="badge">未生成</span>
        </div>
        <div class="content">
          <div id="minutesContent" class="empty-state">生成纪要后，这里会展示摘要、结论、待办和风险。</div>
        </div>
      </section>

      <section class="panel transcript-panel" aria-label="实时转写区">
        <div class="panel-head">
          <div>
            <h2 class="panel-title">实时转写</h2>
            <p class="panel-note">会议视频音频识别结果。</p>
          </div>
          <span id="transcriptCount" class="badge">0 条</span>
        </div>
        <div class="content">
          <div id="transcriptList" class="transcript-list">
            <div class="empty-state">会议开始后，转写内容将自动显示。</div>
          </div>
        </div>
      </section>

      <section class="panel query-panel" aria-label="历史纪要知识库查询区">
        <div class="panel-head">
          <div>
            <h2 class="panel-title">历史纪要查询</h2>
            <p class="panel-note">从会议纪要知识库中检索并回答。</p>
          </div>
          <div class="panel-head-actions">
            <button id="loadHistoryBtn" type="button">历史纪要</button>
          </div>
        </div>
        <div class="content">
          <div class="query-box">
            <textarea id="queryInput" aria-label="历史纪要查询问题">这次会议有哪些待办事项？</textarea>
            <div class="query-actions">
              <button id="queryBtn" class="primary" type="button">查询问题</button>
            </div>
          </div>
          <div id="queryAnswer" class="answer"></div>
        </div>
      </section>
    </section>

  </main>

  <div id="historyModal" class="modal-backdrop" aria-hidden="true">
    <section class="minutes-dialog" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle">
      <div class="dialog-head">
        <div class="dialog-title-row">
          <h2 id="historyModalTitle" class="dialog-title">历史会议摘要</h2>
          <button id="backToHistoryListBtn" type="button" hidden>返回列表</button>
        </div>
        <button id="closeHistoryModalBtn" type="button" aria-label="关闭历史会议纪要">关闭</button>
      </div>
      <div id="historyModalBody" class="dialog-body">
        <div id="historyList" class="history-list" aria-label="历史纪要列表"></div>
      </div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="config.local.js"></script>
  <script type="module">
    const DEFAULT_MEETING_TITLE = "会议助手演示";
    const WORKFLOW_ENDPOINT = "/v1/workflow/run";
    const FILE_UPLOAD_ENDPOINT = "/v1/files/upload";
    const COZE_SDK_VERSION = "1.3.9";
    const COZE_SDK_CORE_URL = `https://esm.sh/@coze/api@${COZE_SDK_VERSION}`;
    const COZE_SDK_WS_TOOLS_URL = `https://esm.sh/@coze/api@${COZE_SDK_VERSION}/ws-tools`;
    const DEFAULT_CONFIG = window.MEETING_HOST_CONFIG || {};

    const history = [];

    let transcript = [];
    let minutesGenerated = false;
    let meetingActive = false;
    let screenStream = null;
    let speechRecognition = null;
    let browserSpeechActive = false;
    let cozeTranscriptionClient = null;
    let liveTranscriptItemId = "";
    let asrNoTranscriptTimer = null;
    let meetingId = "";
    let meetingStartedAt = 0;
    let currentMinutesMarkdown = "";

    const meetingStatus = document.getElementById("meetingStatus");
    const videoSurface = document.getElementById("videoSurface");
    const screenVideo = document.getElementById("screenVideo");
    const videoState = document.getElementById("videoState");
    const startBtn = document.getElementById("startBtn");
    const minutesBtn = document.getElementById("minutesBtn");
    const saveBtn = document.getElementById("saveBtn");
    const transcriptList = document.getElementById("transcriptList");
    const transcriptCount = document.getElementById("transcriptCount");
    const minutesContent = document.getElementById("minutesContent");
    const minutesState = document.getElementById("minutesState");
    const queryInput = document.getElementById("queryInput");
    const queryBtn = document.getElementById("queryBtn");
    const queryAnswer = document.getElementById("queryAnswer");
    const meetingTopicInput = document.getElementById("meetingTopicInput");
    const loadHistoryBtn = document.getElementById("loadHistoryBtn");
    const historyModal = document.getElementById("historyModal");
    const historyModalTitle = document.getElementById("historyModalTitle");
    const historyModalBody = document.getElementById("historyModalBody");
    const backToHistoryListBtn = document.getElementById("backToHistoryListBtn");
    const closeHistoryModalBtn = document.getElementById("closeHistoryModalBtn");

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setBadge(element, text, className) {
      element.textContent = text;
      element.classList.remove("status-idle", "status-live");
      element.classList.add(className);
    }

    function normalizeBaseUrl(value) {
      return String(value || "https://api.coze.cn").replace(/\/+$/, "");
    }

    function resolveCozeBaseWsUrl(baseUrl, configuredBaseWsUrl) {
      if (configuredBaseWsUrl) {
        return String(configuredBaseWsUrl).replace(/\/+$/, "");
      }
      return baseUrl.includes("coze.cn") ? "wss://ws.coze.cn" : "wss://ws.coze.com";
    }

    function getConfig() {
      const coze = DEFAULT_CONFIG.coze || {};
      const workflows = coze.workflows || {};
      const baseUrl = normalizeBaseUrl(coze.baseUrl);
      return {
        baseUrl,
        baseWsUrl: resolveCozeBaseWsUrl(baseUrl, coze.baseWsUrl),
        pat: String(coze.pat || "").trim(),
        botId: String(coze.botId || "").trim(),
        receiveTranscriptWorkflowId: String(workflows.receiveTranscript || "").trim(),
        generateMinutesWorkflowId: String(workflows.generateMinutes || "").trim(),
        saveMinutesWorkflowId: String(workflows.saveMinutes || "").trim(),
        searchMinutesWorkflowId: String(workflows.searchMinutes || "").trim(),
        listMinutesWorkflowId: String(workflows.listMinutes || "").trim(),
        meetingTitle: meetingTopicInput.value.trim() || DEFAULT_MEETING_TITLE
      };
    }

    function syncMeetingTitle() {
      const config = getConfig();
      document.getElementById("meetingTitle").textContent = config.meetingTitle;
    }

    function loadConfig() {
      meetingTopicInput.value = DEFAULT_CONFIG.app?.meetingTitle || DEFAULT_MEETING_TITLE;
      syncMeetingTitle();
    }

    function renderTranscript() {
      transcriptCount.textContent = transcript.length + " 条";
      if (transcript.length === 0) {
        transcriptList.innerHTML = '<div class="empty-state">会议开始后，实时转写内容将自动显示。</div>';
        return;
      }

      transcriptList.innerHTML = transcript.map((item) => `
        <article class="transcript-item">
          <span class="time">${escapeHtml(item.time)}</span>
          <div>
            <p class="speaker">${escapeHtml(item.pending ? `${item.speaker}（转写中）` : item.speaker)}</p>
            <p class="text">${escapeHtml(item.text)}</p>
          </div>
        </article>
      `).join("");
      transcriptList.scrollTop = transcriptList.scrollHeight;
    }

    function setAsrStatus(message) {
      if (transcript.length > 0) {
        return;
      }
      transcriptList.innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
    }

    function clearAsrNoTranscriptHint() {
      if (asrNoTranscriptTimer) {
        clearTimeout(asrNoTranscriptTimer);
        asrNoTranscriptTimer = null;
      }
    }

    function scheduleAsrNoTranscriptHint() {
      clearAsrNoTranscriptHint();
      asrNoTranscriptTimer = setTimeout(() => {
        if (!meetingActive || transcript.length > 0) {
          return;
        }
        setAsrStatus("Coze ASR 已启动，但暂时没有收到转写文本。请确认浏览器麦克风权限已允许、系统输入设备选对，并靠近麦克风说话。");
      }, 15000);
    }

    function markAsrReceivedText() {
      clearAsrNoTranscriptHint();
    }

    function renderHistory() {
      historyModalTitle.textContent = "历史会议摘要";
      backToHistoryListBtn.hidden = true;
      if (history.length === 0) {
        historyModalBody.innerHTML = '<div id="historyList" class="history-list" aria-label="历史纪要列表"></div>';
        return;
      }
      historyModalBody.innerHTML = `
        <div id="historyList" class="history-list" aria-label="历史纪要列表">
          ${history.map((item) => `
        <button class="history-card" type="button" data-history-id="${escapeHtml(item.id)}">
          <strong>${escapeHtml(item.title)}</strong>

    function openHistoryListModal() {
      historyModalTitle.textContent = "历史会议摘要";
      backToHistoryListBtn.hidden = true;
      if (history.length === 0) {
        historyModalBody.innerHTML = '<div id="historyList" class="history-list" aria-label="历史纪要列表"></div>';
      } else {

      historyModal.classList.add("is-open");
      historyModal.setAttribute("aria-hidden", "false");
    }

    function renderMarkdown(markdown) {
      return `<pre class="markdown-output">${escapeHtml(markdown)}</pre>`;
    }

    function formatClock(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function parseMaybeJson(value) {
      if (typeof value !== "string") {
        return value;
      }
      try {
        return JSON.parse(value);
      } catch (error) {
        return value;
      }
    }

    function unwrapWorkflowData(response) {
      const data = parseMaybeJson(response.data);
      if (data && typeof data === "object" && "output" in data) {
        return parseMaybeJson(data.output);
      }
      return data;
    }

    function pickWorkflowText(value, keys) {
      const data = parseMaybeJson(value);
      if (typeof data === "string") {
        return data;
      }
      if (!data || typeof data !== "object") {
        return "";
      }
      for (const key of keys) {
        if (typeof data[key] === "string") {
          return data[key];
        }
      }
      if (typeof data.output === "string") {
        return data.output;
      }
      return JSON.stringify(data, null, 2);
    }

    function pickFirstString(data, keys, fallback = "") {
      if (!data || typeof data !== "object") {
        return fallback;
      }
      for (const key of keys) {
        if (typeof data[key] === "string" && data[key].trim()) {
          return data[key].trim();
        }
      }
      return fallback;
    }

    function pickHistoryArray(value) {
      const data = parseMaybeJson(value);
      if (Array.isArray(data)) {
        return data;
      }
      if (!data || typeof data !== "object") {
        return [];
      }
      for (const key of ["items", "list", "records", "histories", "minutes", "documents", "data", "output", "result"]) {
        const nested = parseMaybeJson(data[key]);
        if (Array.isArray(nested)) {
          return nested;
        }
        if (nested && typeof nested === "object" && nested !== data) {
          const nestedItems = pickHistoryArray(nested);
          if (nestedItems.length) {
            return nestedItems;
          }
        }
      }
      if (pickFirstString(data, ["title", "meeting_title", "meetingTitle", "name", "document_name"]) || pickFirstString(data, ["minutes_md", "minutes", "content", "markdown", "detail", "text"])) {
        return [data];
      }
      return [];
    }

    function normalizeHistoryItem(item, index) {
      const parsed = parseMaybeJson(item);
      if (typeof parsed === "string") {
        return {
          id: `history_${index}_${Date.now()}`,
          title: "未命名会议纪要",
          summary: parsed.slice(0, 90),
          minutes: parsed
        };
      }

      const title = pickFirstString(parsed, ["title"]) || "未命名会议纪要";
      const minutes = pickFirstString(parsed, ["minutes_md", "minutes", "content", "markdown", "detail", "text", "raw_text", "output"]);
      const summary = pickFirstString(parsed, ["summary", "abstract", "description", "snippet"], minutes ? minutes.slice(0, 90) : "点击查看会议纪要内容。");
      return {
        id: pickFirstString(parsed, ["id", "document_id", "knowledge_document_id"], `history_${index}_${Date.now()}`),
        title,
        summary,
        minutes: minutes || summary
      };
    }

    function normalizeHistoryItems(result) {
      return pickHistoryArray(result).map(normalizeHistoryItem);
    }

    function openHistoryMinutes(item) {
      if (!item) {
        return;
      }
      historyModalTitle.textContent = item.title;
      backToHistoryListBtn.hidden = false;
      historyModalBody.innerHTML = `
        ${renderMarkdown(item.minutes || item.summary || "暂无纪要内容。")}
      `;
      historyModal.classList.add("is-open");
      historyModal.setAttribute("aria-hidden", "false");
    }

    function closeHistoryMinutes() {
      historyModal.classList.remove("is-open");
      historyModal.setAttribute("aria-hidden", "true");
    }

    async function callWorkflow(workflowId, parameters) {
      const config = getConfig();
      if (!config.pat) {
        throw new Error("请先填写 Coze Personal Access Token。");
      }
      if (!workflowId) {
        throw new Error("请先填写对应的 Coze 工作流 ID。");
      }

      const response = await fetch(`${config.baseUrl}${WORKFLOW_ENDPOINT}`, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${config.pat}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          workflow_id: workflowId,
          bot_id: config.botId || undefined,
          parameters
        })
      });

      if (!response.ok) {
        throw new Error(`Coze 请求失败：HTTP ${response.status}`);
      }

      const payload = await response.json();
      if (payload.code !== 0 && payload.code !== "0") {
        throw new Error(payload.msg || "Coze 工作流执行失败。");
      }
      return unwrapWorkflowData(payload);
    }

    function sanitizeFileNameSegment(value) {
      return String(value || "meeting")
        .trim()
        .replace(/[\\/:*?"<>|]/g, "_")
        .replace(/\s+/g, "_")
        .slice(0, 60) || "meeting";
    }

    function buildMeetingMinutesText(config, createdTime) {
      return [
        `会议ID：${meetingId}`,
        `会议标题：${config.meetingTitle}`,
        `创建时间：${createdTime}`,
        "",
        currentMinutesMarkdown
      ].join("\n");
    }

    function buildMeetingMinutesFileName(config, createdTime) {
      const datePart = createdTime.slice(0, 10);
      return `${datePart}_${sanitizeFileNameSegment(config.meetingTitle)}_会议纪要.txt`;
    }

    function extractUploadedFileId(payload) {
      const data = payload?.data || payload;
      return pickFirstString(data, ["id", "file_id", "fileId"]);
    }

    async function uploadCozeTextFile(fileName, text) {
      const config = getConfig();
      if (!config.pat) {
        throw new Error("请先填写 Coze Personal Access Token。");
      }

      const fileBlob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const formData = new FormData();
      formData.append("file", fileBlob, fileName);

      const response = await fetch(`${config.baseUrl}${FILE_UPLOAD_ENDPOINT}`, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${config.pat}`
        },
        body: formData
      });

      if (!response.ok) {
        throw new Error(`Coze 文件上传失败：HTTP ${response.status}`);
      }

      const payload = await response.json();
      if (payload.code !== 0 && payload.code !== "0") {
        throw new Error(payload.msg || "Coze 文件上传失败。");
      }

      const fileId = extractUploadedFileId(payload);
      if (!fileId) {
        throw new Error("Coze 文件上传成功，但未返回 file_id。");
      }
      return fileId;
    }

    function buildSaveMinutesWorkflowParameters(config, createdTime, knowledgeFileId, meetingText) {
      return {
        meeting_id: meetingId,
        meeting_title: config.meetingTitle,
        created_time: createdTime,
        knowledge: JSON.stringify({ file_id: knowledgeFileId }),
        meeting_text: meetingText
      };
    }

    async function cleanTranscriptChunk(rawText) {
      const config = getConfig();
      if (!config.receiveTranscriptWorkflowId) {
        return rawText;
      }
      const result = await callWorkflow(config.receiveTranscriptWorkflowId, {
        meeting_id: meetingId,
        meeting_title: config.meetingTitle,
        transcript_chunk: rawText,
        timestamp: formatClock(Date.now() - meetingStartedAt)
      });
      return pickWorkflowText(result, ["clean_chunk", "text", "output"]) || rawText;
    }

    function markTranscriptChanged() {
      minutesState.textContent = "待更新";
      minutesGenerated = false;
      currentMinutesMarkdown = "";
      saveBtn.disabled = true;
      saveBtn.textContent = "保存到知识库";
      minutesBtn.disabled = false;
    }

    async function appendTranscriptChunk(rawText) {
      const text = rawText.trim();
      if (!text) {
        return;
      }

      markAsrReceivedText();
      const cleanText = await cleanTranscriptChunk(text);
      transcript.push({
        time: formatClock(Date.now() - meetingStartedAt),
        speaker: "会议主持人",
        text: cleanText
      });
      renderTranscript();
      markTranscriptChanged();
    }

    function upsertLiveTranscriptChunk(rawText) {
      const text = rawText.trim();
      if (!text) {
        return;
      }

      markAsrReceivedText();
      let liveItem = transcript.find((item) => item.id === liveTranscriptItemId);
      if (!liveItem) {
        liveTranscriptItemId = `live_${Date.now()}`;
        liveItem = {
          id: liveTranscriptItemId,
          time: formatClock(Date.now() - meetingStartedAt),
          speaker: "会议主持人",
          text,
          pending: true
        };
        transcript.push(liveItem);
      } else {
        liveItem.text = text;
        liveItem.pending = true;
      }
      renderTranscript();
      markTranscriptChanged();
    }

    async function finalizeLiveTranscriptChunk(rawText) {
      const text = rawText.trim();
      if (!text) {
        return;
      }

      markAsrReceivedText();
      const liveItem = transcript.find((item) => item.id === liveTranscriptItemId);
      if (!liveItem) {
        await appendTranscriptChunk(text);
        return;
      }

      liveTranscriptItemId = "";
      liveItem.text = await cleanTranscriptChunk(text);
      liveItem.pending = false;
      renderTranscript();
      markTranscriptChanged();
    }

    async function loadCozeTranscriptionSdk() {
      const [coreModule, wsToolsModule] = await Promise.all([
        import(COZE_SDK_CORE_URL),
        import(COZE_SDK_WS_TOOLS_URL)
      ]);
      return {
        WebsocketsEventType: coreModule.WebsocketsEventType,
        WsTranscriptionClient: wsToolsModule.WsTranscriptionClient
      };
    }

    function getEventContent(event) {
      return String(event?.data?.content || "").trim();
    }

    async function startCozeAsr() {
      const config = getConfig();
      if (!config.pat) {
        throw new Error("请先在 config.js 填写 Coze Personal Access Token。");
      }

      setAsrStatus("正在加载 Coze 实时转写 SDK...");
      const { WebsocketsEventType, WsTranscriptionClient } = await loadCozeTranscriptionSdk();
      if (!WsTranscriptionClient) {
        throw new Error("Coze 转写 SDK 加载失败。");
      }

      const client = new WsTranscriptionClient({
        token: config.pat,
        baseWsURL: config.baseWsUrl,
        allowPersonalAccessTokenInBrowser: true,
        debug: false,
        audioCaptureConfig: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      const handleError = (event) => {
        if (!meetingActive) {
          return;
        }
        const message = event?.data?.msg || event?.message || "实时转写中断";
        clearAsrNoTranscriptHint();
        setAsrStatus(`Coze ASR 提示：${message}`);
      };

      client.on(WebsocketsEventType.ALL, (event) => {
        if (event?.event_type && event.event_type !== WebsocketsEventType.TRANSCRIPTIONS_MESSAGE_UPDATE) {
          console.debug("[transcription] event", event.event_type, event);
        }
      });
      client.on(WebsocketsEventType.ERROR, handleError);
      client.on(WebsocketsEventType.CLIENT_ERROR, handleError);
      client.on(WebsocketsEventType.TRANSCRIPTIONS_CREATED, () => {
        if (meetingActive) {
          setAsrStatus("Coze ASR 已连接，正在监听麦克风。");
        }
      });
      client.on(WebsocketsEventType.TRANSCRIPTIONS_UPDATED, () => {
        if (meetingActive) {
          setAsrStatus("Coze ASR 配置已更新，正在等待语音。");
        }
      });
      client.on(WebsocketsEventType.INPUT_AUDIO_BUFFER_SPEECH_STARTED, () => {
        if (meetingActive) {
          setAsrStatus("检测到语音，正在识别...");
        }
      });
      client.on(WebsocketsEventType.INPUT_AUDIO_BUFFER_SPEECH_STOPPED, () => {
        if (meetingActive) {
          setAsrStatus("语音段结束，正在等待转写结果...");
        }
      });
      client.on(WebsocketsEventType.TRANSCRIPTIONS_MESSAGE_UPDATE, (event) => {
        const text = getEventContent(event);
        if (text && meetingActive) {
          upsertLiveTranscriptChunk(text);
        }
      });
      client.on(WebsocketsEventType.TRANSCRIPTIONS_MESSAGE_COMPLETED, async (event) => {
        const text = getEventContent(event);
        if (text && meetingActive) {
          await finalizeLiveTranscriptChunk(text);
        }
      });

      await client.start();
      cozeTranscriptionClient = client;
      setAsrStatus("Coze ASR 已启动，正在等待语音。");
      scheduleAsrNoTranscriptHint();
    }

    function stopCozeAsr() {
      clearAsrNoTranscriptHint();
      const client = cozeTranscriptionClient;
      cozeTranscriptionClient = null;
      if (!client) {
        return;
      }
      try {
        client.stop();
      } catch (error) {
        // Stop can throw if the SDK has already closed the recorder.
      }
      try {
        client.destroy();
      } catch (error) {
        // Destroy is best-effort cleanup.
      }
    }

    function startBrowserSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        return false;
      }

      const recognition = new SpeechRecognition();
      let browserSpeechShouldRestart = true;
      let browserSpeechFatal = false;
      speechRecognition = recognition;
      recognition.lang = "zh-CN";
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.addEventListener("result", async (event) => {
        let finalText = "";
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const result = event.results[index];
          if (result.isFinal && result[0]?.transcript) {
            finalText += result[0].transcript;
          }
        }
        if (finalText.trim()) {
          await appendTranscriptChunk(finalText);
        }
      });

      recognition.addEventListener("error", (event) => {
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          browserSpeechFatal = true;
          browserSpeechShouldRestart = false;
        }
        if (meetingActive) {
          setAsrStatus(`浏览器语音识别提示：${event.error || "识别中断"}。`);
        }
      });

      recognition.addEventListener("end", () => {
        if (meetingActive && speechRecognition === recognition && browserSpeechShouldRestart && !browserSpeechFatal) {
          try {
            recognition.start();
          } catch (error) {
            // Some browsers throw if start is called too quickly after end.
          }
        }
      });

      try {
        recognition.start();
        browserSpeechActive = true;
        return true;
      } catch (error) {
        speechRecognition = null;
        browserSpeechActive = false;
        return false;
      }
    }

    function stopBrowserSpeechRecognition() {
      if (!speechRecognition) {
        return;
      }
      const recognition = speechRecognition;
      speechRecognition = null;
      browserSpeechActive = false;
      recognition.onend = null;
      try {
        recognition.stop();
      } catch (error) {
        // Already stopped.
      }
    }

    async function startRealtimeAsr() {
      try {
        await startCozeAsr();
        return;
      } catch (error) {
        const browserAsrStarted = startBrowserSpeechRecognition();
        if (browserAsrStarted) {
          setAsrStatus(`Coze ASR 启动失败：${error.message}。已切换到浏览器语音识别。`);
          return;
        }
        throw new Error(`Coze ASR 启动失败：${error.message}；当前浏览器也不支持 Web Speech API。`);
      }
    }

    async function stopRealtimeAsr() {
      stopCozeAsr();
      stopBrowserSpeechRecognition();
    }

    async function generateMinutes() {
      if (transcript.length === 0) {
        minutesContent.innerHTML = '<div class="empty-state">暂无实时转写内容，无法生成纪要。</div>';
        return;
      }

      const config = getConfig();
      minutesState.textContent = "生成中";
      minutesBtn.disabled = true;
      try {
        const result = await callWorkflow(config.generateMinutesWorkflowId, {
          meeting_id: meetingId,
          meeting_title: config.meetingTitle,
          clean_transcript: transcript.map((item) => `[${item.time}] ${item.text}`).join("\n")
        });
        currentMinutesMarkdown = pickWorkflowText(result, ["minutes_md", "output", "markdown", "answer"]);
        minutesContent.innerHTML = renderMarkdown(currentMinutesMarkdown);
        minutesGenerated = true;
        minutesState.textContent = "已生成";
        saveBtn.disabled = false;
      } catch (error) {
        minutesState.textContent = "生成失败";
        minutesContent.innerHTML = `<div class="empty-state">${escapeHtml(error.message)}</div>`;
      } finally {
        minutesBtn.disabled = false;
      }
    }

    async function saveCurrentMinutes() {
      if (!minutesGenerated || !currentMinutesMarkdown) {
        return;
      }

      const config = getConfig();
      saveBtn.disabled = true;
      saveBtn.textContent = "生成TXT";
      try {
        const createdTime = new Date().toISOString();
        const meetingText = buildMeetingMinutesText(config, createdTime);
        const fileName = buildMeetingMinutesFileName(config, createdTime);
        saveBtn.textContent = "上传TXT";
        const knowledgeFileId = await uploadCozeTextFile(fileName, meetingText);
        saveBtn.textContent = "保存中";
        const result = await callWorkflow(
          config.saveMinutesWorkflowId,
          buildSaveMinutesWorkflowParameters(config, createdTime, knowledgeFileId, meetingText)
        );
        const documentId = pickWorkflowText(result, ["documentId", "knowledge_document_id", "document_id", "output"]);
        const fileUrl = pickWorkflowText(result, ["fileUrl", "file_url"]);
        history.unshift({
          id: documentId || `saved_${Date.now()}`,
          title: `${new Date().toLocaleDateString("zh-CN")} ${config.meetingTitle}纪要`,
          summary: documentId ? `已写入 Coze 知识库：${documentId}${fileUrl ? `，${fileUrl}` : ""}` : "已写入 Coze 知识库。",
          minutes: currentMinutesMarkdown
        });
        saveBtn.textContent = "已保存";
        renderHistory();
      } catch (error) {
        saveBtn.disabled = false;
        saveBtn.textContent = "保存到知识库";
        historyModalBody.innerHTML = `<div class="empty-state">保存失败：${escapeHtml(error.message)}</div>`;
      }
    }

    async function loadHistoryList() {
      const config = getConfig();
      openHistoryListModal();
      loadHistoryBtn.disabled = true;
      loadHistoryBtn.textContent = "加载中";
      historyModalBody.innerHTML = '<div class="empty-state">历史纪要加载中。</div>';
      try {
        const result = await callWorkflow(config.listMinutesWorkflowId, {
          meeting_title: config.meetingTitle,
          limit: 20
        });
        history.splice(0, history.length, ...normalizeHistoryItems(result));
        renderHistory();
        if (history.length === 0) {
          historyModalBody.innerHTML = '<div class="empty-state">暂无历史会议纪要。</div>';
        }
      } catch (error) {
        historyModalBody.innerHTML = `<div class="empty-state">历史纪要加载失败：${escapeHtml(error.message)}</div>`;
      } finally {
        loadHistoryBtn.disabled = false;
        loadHistoryBtn.textContent = "历史纪要";
      }
    }

    async function queryHistory() {

        return;

      queryBtn.textContent = "查询中";

        });

    async function startScreenShare() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        videoState.textContent = "视频状态：当前浏览器不支持屏幕共享";
        return false;
      }

      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 30 },
          audio: false
        });
        screenVideo.srcObject = screenStream;
        videoSurface.classList.add("is-live");
        videoState.textContent = "视频状态：正在共享本地屏幕";

        const [track] = screenStream.getVideoTracks();
        if (track) {
          track.addEventListener("ended", () => {
            clearScreenShare("视频状态：屏幕共享已停止");
          });
        }
        return true;
      } catch (error) {
        videoSurface.classList.remove("is-live");
        screenVideo.srcObject = null;
        videoState.textContent = "视频状态：未授权屏幕共享";
        return false;
      }
    }

    function clearScreenShare(statusText) {
      if (screenStream) {
        screenStream.getTracks().forEach((track) => track.stop());
      }
      screenStream = null;
      screenVideo.srcObject = null;
      videoSurface.classList.remove("is-live");
      videoState.textContent = statusText;
    }

    async function startMeeting() {
      syncMeetingTitle();
      meetingId = `mtg_${Date.now()}`;
      meetingStartedAt = Date.now();
      transcript = [];
      liveTranscriptItemId = "";
      currentMinutesMarkdown = "";
      minutesGenerated = false;
      renderTranscript();
      minutesContent.innerHTML = '<div class="empty-state">生成纪要后，这里会展示摘要、结论、待办和风险。</div>';
      minutesState.textContent = "未生成";
      saveBtn.disabled = true;
      saveBtn.textContent = "保存到知识库";

      meetingActive = true;
      setBadge(meetingStatus, "状态：记录中", "status-live");
      videoState.textContent = "视频状态：等待实时转写启动";
      startBtn.textContent = "停止会议";

      try {
        await startRealtimeAsr();
        videoState.textContent = "视频状态：请求屏幕共享中";
        await startScreenShare();
      } catch (error) {
        meetingActive = false;
        setBadge(meetingStatus, "状态：ASR 未启动", "status-idle");
        startBtn.textContent = "开始会议";
        transcriptList.innerHTML = `<div class="empty-state">麦克风转写启动失败：${escapeHtml(error.message)}</div>`;
      }
    }

    async function stopMeeting() {
      meetingActive = false;
      await stopRealtimeAsr();
      clearScreenShare("视频状态：会议已停止");
      setBadge(meetingStatus, "状态：已结束", "status-idle");
      startBtn.textContent = "重新开始会议";
      minutesBtn.disabled = transcript.length === 0;
    }

    startBtn.addEventListener("click", async () => {
      if (meetingActive) {
        await stopMeeting();
        return;
      }
      await startMeeting();
    });

    minutesBtn.addEventListener("click", generateMinutes);
    saveBtn.addEventListener("click", saveCurrentMinutes);
    queryBtn.addEventListener("click", queryHistory);
    loadHistoryBtn.addEventListener("click", loadHistoryList);
    historyModalBody.addEventListener("click", (event) => {
      const card = event.target.closest(".history-card");
      if (!card) {
        return;
      }
      openHistoryMinutes(history.find((item) => item.id === card.dataset.historyId));
    });
    backToHistoryListBtn.addEventListener("click", showHistoryList);
    closeHistoryModalBtn.addEventListener("click", closeHistoryMinutes);
    historyModal.addEventListener("click", (event) => {
      if (event.target === historyModal) {
        closeHistoryMinutes();
      }
    });
    meetingTopicInput.addEventListener("input", syncMeetingTitle);

    loadConfig();
    renderTranscript();
    renderHistory();
  </script>
</div>
</body>
</html>
